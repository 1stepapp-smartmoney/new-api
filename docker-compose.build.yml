# docker-compose.build.yml
#
# 专用于「构建 + 打标签」的 compose 文件，不会启动任何服务。
# 放在仓库根目录，与 Dockerfile 同级。
#
# 使用方式（构建机）：
#   推荐走 scripts/build.sh（已帮你处理 VERSION 文件、profile、环境变量、推送）
#
#   手工构建：
#     export DOCKERHUB_USER=your-dockerhub-username
#     export IMAGE_TAG=v0.10.0
#     echo "$IMAGE_TAG" > VERSION
#     docker compose -f docker-compose.build.yml --profile build-only build --pull
#
# 构建产物：
#   - <DOCKERHUB_USER>/nexapi:<IMAGE_TAG>
#   - <DOCKERHUB_USER>/nexapi:latest

services:
  nexapi-builder:
    # image 字段在 build 时会作为主标签写入
    image: ${DOCKERHUB_USER:-local}/nexapi:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      # 默认只构建当前主机架构；如需多架构请改用 docker buildx bake
      # platforms:
      #   - linux/amd64
      #   - linux/arm64
      # 追加第二个 tag: latest，构建完 image 字段 + tags 两个标签都会指向同一镜像
      tags:
        - ${DOCKERHUB_USER:-local}/nexapi:latest
    # 挂到 build-only profile 下，必须通过 --profile build-only 显式激活才能构建。
    # 防止 `docker compose up` 或无 profile 的 build 命令误触发此服务。
    profiles:
      - build-only
