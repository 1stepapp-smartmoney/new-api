# Canonical production docker-compose (AWS-backed deployment, nexapi.org).
#
# Backing services are all managed/external, never sidecar containers:
#   SQL_DSN           -> AWS RDS MySQL 8.0 (ap-northeast-1)
#   LOG_SQL_DSN       -> ClickHouse (request logs live there, NOT in the main DB)
#   REDIS_CONN_STRING -> ElastiCache for Valkey (TLS, so rediss://)
# Those and the other secrets live in `.env`, which is NOT checked in to git.
#
# This file matches the Tokyo site verbatim. The two us-west-2 sites run the
# same image with three per-site deltas (container_name, published port,
# mem_limit) — see deploy/README.md for the table and the drift-check command.
#
# Deploys are driven from a workstation by `scripts/redeploy.sh`, which builds,
# pushes, pulls and health-checks every site. Manual equivalent, per host:
#
#   cd ~/nexapi-docker && sudo docker compose pull && sudo docker compose up -d
#
# NOTE: `up -d` (not `restart`) is required for `.env` or compose changes to
# take effect — `restart` reuses the old container definition.
#
# (The root `docker-compose.yml` is the upstream demo template with bundled
#  postgres + redis; do not use it for prod.)

services:
  new-api:
    image: zjlywjh001/nexapi:latest
    pull_policy: always
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    # Hard ceiling so a runaway heap kills only this container (restart: always
    # brings it back) instead of driving the whole host into kernel OOM. Keep
    # GOMEMLIMIT in `.env` several GB BELOW this value, so Go's GC turns
    # aggressive and settles the heap before Docker ever has to intervene.
    # Per-site value: Tokyo (62 GiB box, single site) uses 40g; each us-west-2
    # site uses 24g because two sites share one 64 GiB box.
    mem_limit: 40g
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      # Startup grace period. GORM AutoMigrate on a multi-million-row `logs`
      # table can take ~130s when a declared index is missing (see
      # FORK-CHANGES.md §5 "Operational trap"); without this, the container
      # is reported unhealthy during the rebuild and upstream proxies / load
      # balancers may stop sending traffic.
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
